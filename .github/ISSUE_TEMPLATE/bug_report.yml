name: Bug report

description: Something in Pi Pairing does not behave as documented

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please do not use this form for security issues — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Pi Pairing version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - CLI
        - Skill or session guide
        - Installation
        - Research workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands, clicks, and configuration used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and Pi version.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, terminal output, or screenshots.
    validations:
      required: false
